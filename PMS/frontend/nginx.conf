server {
    listen 80;
    server_name _;
    client_max_body_size 10m;   # resim yükleme

    root /usr/share/nginx/html;
    index index.html;

    # Django API + admin paneli
    # Docker DNS: backend yeniden oluşturulup IP'si değişse bile 502 vermesin
    resolver 127.0.0.11 valid=10s;

    location ~ ^/(api|admin)/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Admin paneli statik dosyaları ve yüklenen resimler (backend ile paylaşılan volume'lar)
    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # Frontend build'i (SPA): bilinmeyen yollar index.html'e düşer
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
